name: Backtest (last 60 days)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m agent.backtest
      - name: Save results
        run: |
          git config user.name trading-agent
          git config user.email agent@users.noreply.github.com
          git add BACKTEST.md
          git add state/backtest_trades.csv 2>/dev/null || true
          git commit -m "backtest results" || exit 0
          git pull --rebase -q && git push -q
