name: Fetch all-NSE research data

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m research.fetch_all
      - name: Save to research-data-all branch
        run: |
          git config user.name trading-agent
          git config user.email agent@users.noreply.github.com
          git checkout -B research-data-all
          git add -f data/
          git commit -qm "all-NSE research data $(date -u +%F)"
          git push -f origin research-data-all
