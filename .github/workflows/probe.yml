name: Probe NSE pre-open data

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python research/nse_preopen_probe.py | tee probe.txt
      - name: Save output
        run: |
          git config user.name trading-agent
          git config user.email agent@users.noreply.github.com
          git checkout -B probe-output
          git add -f probe.txt
          git commit -qm "probe output"
          git push -f origin probe-output
